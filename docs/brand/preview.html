<!doctype html><meta charset="utf-8"><title>Ferrite logo</title>
<style>
body{margin:0;font:14px system-ui;display:grid;grid-template-columns:repeat(3,1fr)}
.t{padding:24px;display:flex;flex-direction:column;gap:14px;min-height:150px}
.row{display:flex;align-items:center;gap:16px}
svg{display:block}
</style>
<script>
const mark = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 120" role="img" aria-label="Ferrite">   <!-- Cassette: body and reels in currentColor. The tape in the accent colour comes out from behind it: the mask cuts the tape off at the body (plus a small gap). -->   <mask id="ferrite-front" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="120">     <rect width="128" height="120" fill="#fff"/>     <rect x="1" y="3" width="126" height="88" rx="19" fill="#000"/>   </mask>   <path mask="url(#ferrite-front)" d="M90 70 V90 C 90 102, 104 100, 106 111 L 106 118" fill="none" stroke="var(--color-accent, currentColor)" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round"/>   <g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">     <rect x="6" y="8" width="116" height="78" rx="14"/>     <circle cx="42" cy="44" r="14"/>     <circle cx="86" cy="44" r="14"/>     <path d="M28 86 L36 68 H92 L100 86"/>   </g>   <circle cx="42" cy="44" r="4.5" fill="currentColor"/>   <circle cx="86" cy="44" r="4.5" fill="currentColor"/> </svg> `;
const themes = [
 ['Light','#fbf6ec','#3b2e24','#c8643a'],['Classic Mac','#fff','#000','#000'],['Desktop 95','#c0c0c0','#000','#000080'],
 ['Plain page','#fff','#000','#0000ee'],['Plum','#4d2f4a','#f6ecd8','#e48a5e'],['Amber','#120b02','#ffc861','#ffb000'],
 ['Phosphor','#020f06','#8dffa8','#33ff66'],['Commodore','#352879','#d6d0ff','#bfce72'],['Amiga','#0055aa','#fff','#ff8800'],
];
for (const [n,bg,fg,ac] of themes) document.write(`<div class="t" style="background:${bg};color:${fg};--color-accent:${ac}"><b>${n}</b><div class="row"><div style="width:96px">${mark}</div><div style="width:32px">${mark}</div><div style="width:16px">${mark}</div></div></div>`);
</script>
