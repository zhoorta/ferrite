; Production settings for the Shed container.
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
; Uploads are sent in chunks as raw request bodies, so upload_max_filesize does not apply.
post_max_size = 32M
max_execution_time = 60
zend.assertions = -1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
