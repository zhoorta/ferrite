# /etc/nginx/sites-available/ferrite.stackcare.pt  (symlink into sites-enabled, then certbot --nginx)
server {
    listen 80;
    server_name ferrite.stackcare.pt;
    root /var/www/ferrite/public;
    index index.php;

    client_max_body_size 8m;   # upload chunks are 5 MB; files are never sent in one request

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_buffering off;          # stream downloads and Range requests
        fastcgi_request_buffering off;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
