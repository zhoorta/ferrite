# The public demo only (demo.ferrite.stackcare.pt). The private instance runs natively, see deploy/README.md.
# From this folder:  docker compose up -d --build
# The port is bound to localhost: only nginx can reach it (Docker bypasses ufw otherwise).
services:
  ferrite-demo:
    build: ..
    image: ferrite:latest
    restart: unless-stopped
    env_file: ferrite-demo.env
    ports: ["127.0.0.1:8082:8080"]
    volumes: [ferrite-demo-data:/data]
    mem_limit: 512m

volumes:
  ferrite-demo-data:
